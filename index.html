<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXEL AI – Create Beyond Imagination</title>
    <meta
      name="description"
      content="Create stunning AI-generated artwork with just a simple text prompt. Powered by Google Gemini image models in a futuristic 3D creative studio."
    />
    <meta property="og:title" content="PIXEL AI – Create Beyond Imagination" />
    <meta
      property="og:description"
      content="Create stunning AI-generated artwork with just a simple text prompt. Powered by Google Gemini image models in a futuristic 3D creative studio."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pixel_ai_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F6F8FC] text-slate-900 dark:bg-[#05070D] dark:text-slate-100 antialiased selection:bg-violet-500/30 selection:text-violet-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
